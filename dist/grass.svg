<svg xmlns="http://www.w3.org/2000/svg"
     width="160"
     height="160"
     viewBox="0 0 16 16"
     shape-rendering="crispEdges">

  <defs>
    <pattern id="grassBlock"
             width="16"
             height="16"
             patternUnits="userSpaceOnUse">

      <!-- Dirt -->
      <rect width="16" height="16" fill="#8b5a2b"/>

      <!-- Dirt pixels -->
      <rect x="1" y="5" width="3" height="2" fill="#70451f"/>
      <rect x="8" y="6" width="2" height="2" fill="#70451f"/>
      <rect x="12" y="10" width="3" height="2" fill="#70451f"/>
      <rect x="4" y="12" width="2" height="2" fill="#a66b32"/>
      <rect x="9" y="14" width="3" height="1" fill="#a66b32"/>
      <rect x="2" y="9" width="2" height="1" fill="#a66b32"/>

      <!-- Grass top -->
      <rect x="0" y="0" width="16" height="5" fill="#5eaa3b"/>

      <!-- Grass variations -->
      <rect x="0" y="0" width="4" height="2" fill="#75bd45"/>
      <rect x="7" y="1" width="4" height="2" fill="#6fba42"/>
      <rect x="13" y="0" width="3" height="3" fill="#4e9633"/>

      <!-- Grass overhang -->
      <rect x="0" y="4" width="3" height="2" fill="#62ad3b"/>
      <rect x="5" y="4" width="5" height="1" fill="#4d9632"/>
      <rect x="12" y="4" width="4" height="2" fill="#68b33e"/>

      <!-- Dirt/grass transition -->
      <rect x="3" y="5" width="2" height="2" fill="#669e38"/>
      <rect x="11" y="5" width="2" height="2" fill="#599735"/>

    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#grassBlock)"/>

</svg>